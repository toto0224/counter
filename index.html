<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンスト EXカウンター風ツール</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 450px;
            margin: 20px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { font-size: 20px; color: #ffca28; margin-bottom: 20px; border-bottom: 2px solid #ffca28; padding-bottom: 5px; }
        
        .status-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .status-table td {
            padding: 10px;
            border-bottom: 1px solid #333;
            text-align: left;
        }
        .status-table td.val {
            text-align: right;
            font-weight: bold;
            color: #00e676;
            font-size: 18px;
        }
        .status-table td.highlight { color: #ff5252; }

        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-clear { background-color: #00e676; color: #000; }
        .btn-encounter { background-color: #ff5252; color: #fff; }
        
        .sub-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-edit { background-color: #555; color: #fff; font-size: 14px; padding: 8px; }
        .btn-reset { background-color: #333; color: #aaa; font-size: 14px; padding: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>モンストEXカウンター</h1>
    
    <table class="status-table">
        <tr>
            <td>ハマり</td>
            <td id="hamari" class="val highlight">0</td>
        </tr>
        <tr>
            <td>ラック</td>
            <td id="luck" class="val">0</td>
        </tr>
        <tr>
            <td>遭遇数</td>
            <td id="encounter" class="val">0</td>
        </tr>
        <tr>
            <td>遭遇率</td>
            <td id="rate" class="val">0.00%</td>
        </tr>
        <tr>
            <td>総周回数</td>
            <td id="total" class="val">0</td>
        </tr>
    </table>

    <div class="grid-buttons">
        <button class="btn-clear" onclick="handleClear()">周回 (+1)</button>
        <button class="btn-encounter" onclick="handleEncounter()">遭遇 (リセット)</button>
    </div>

    <div class="sub-buttons">
        <button class="btn-edit" onclick="handleEdit()">数値を編集</button>
        <button class="btn-reset" onclick="handleReset()">リセット</button>
    </div>
</div>

<script>
    const STORAGE_KEY = 'monst_ex_counter_data';

    let data = {
        hamari: 0,
        luck: 0,
        encounter: 0,
        total: 0
    };

    const savedData = localStorage.getItem(STORAGE_KEY);
    if (savedData) {
        try {
            data = JSON.parse(savedData);
        } catch(e) {
            console.error("データ読み込みエラー", e);
        }
    }

    // 前回のミスを修正（リresetになっていたボタン文字のバグもついでに直しました）
    function updateDisplay() {
        document.getElementById('hamari').innerText = data.hamari;
        document.getElementById('luck').innerText = data.luck;
        document.getElementById('encounter').innerText = data.encounter;
        document.getElementById('total').innerText = data.total;

        if (data.total > 0) {
            let rate = (data.encounter / data.total) * 100;
            document.getElementById('rate').innerText = rate.toFixed(2) + '%';
        } else {
            document.getElementById('rate').innerText = '0.00%';
        }
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function handleClear() {
        data.hamari += 1;
        data.total += 1;
        saveData();
        updateDisplay();
    }

    function handleEncounter() {
        data.encounter += 1;
        data.luck += 1;
        data.hamari = 0;
        saveData();
        updateDisplay();
    }

    function handleEdit() {
        let newLuck = prompt("現在のラックを入力してください:", data.luck);
        if (newLuck !== null) {
            data.luck = parseInt(newLuck) || 0;
            saveData();
            updateDisplay();
        }
    }

    function handleReset() {
        if (confirm("すべてのデータをリセットしますか？")) {
            data = { hamari: 0, luck: 0, encounter: 0, total: 0 };
            saveData();
            updateDisplay();
        }
    }

    updateDisplay();
</script>

</body>
</html>
