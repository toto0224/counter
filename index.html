<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンスト わくわくの実カウンター</title>
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 480px;
            margin: 10px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { font-size: 18px; color: #ffca28; text-align: center; margin-top: 5px; margin-bottom: 15px; border-bottom: 2px solid #ffca28; padding-bottom: 5px; }
        
        /* グループごとの枠 */
        .group-box {
            background: #252525;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #ffb300;
        }
        .group-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffca28;
            margin-bottom: 8px;
        }

        /* 各実の行スタイル */
        .fruit-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
        }
        .fruit-row:last-child { border-bottom: none; }
        
        .fruit-name {
            font-size: 15px;
            flex-grow: 1;
            text-align: left;
        }
        
        .count-display {
            font-size: 18px;
            font-weight: bold;
            color: #00e676;
            width: 50px;
            text-align: center;
        }

        /* 押しやすいボタン */
        .btn-control {
            font-size: 16px;
            font-weight: bold;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-minus { background-color: #cf6679; color: #fff; }
        .btn-plus { background-color: #00e676; color: #000; margin-left: 5px; }
        
        /* リセットボタン */
        .btn-reset {
            width: 100%;
            font-size: 14px;
            background-color: #333;
            color: #aaa;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>わくわくの実 所持数カウンター</h1>
    
    <!-- 同族グループ -->
    <div class="group-box">
        <div class="group-title">同族の絆</div>
        <div class="fruit-row">
            <div class="fruit-name">同族加撃</div>
            <button class="btn-control btn-minus" onclick="changeCount('douzoku_kageki', -1)">-</button>
            <div id="douzoku_kageki" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('douzoku_kageki', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">同族加命撃</div>
            <button class="btn-control btn-minus" onclick="changeCount('douzoku_kameigeki', -1)">-</button>
            <div id="douzoku_kameigeki" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('douzoku_kameigeki', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">同族加撃速</div>
            <button class="btn-control btn-minus" onclick="changeCount('douzoku_kagekisoku', -1)">-</button>
            <div id="douzoku_kagekisoku" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('douzoku_kagekisoku', 1)">+</button>
        </div>
    </div>

    <!-- 撃種グループ -->
    <div class="group-box" style="border-left-color: #03a9f4;">
        <div class="group-title" style="color: #03a9f4;">撃種の絆</div>
        <div class="fruit-row">
            <div class="fruit-name">撃種加撃</div>
            <button class="btn-control btn-minus" onclick="changeCount('gekishu_kageki', -1)">-</button>
            <div id="gekishu_kageki" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('gekishu_kageki', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">撃種加命撃</div>
            <button class="btn-control btn-minus" onclick="changeCount('gekishu_kameigeki', -1)">-</button>
            <div id="gekishu_kameigeki" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('gekishu_kameigeki', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">撃種加撃速</div>
            <button class="btn-control btn-minus" onclick="changeCount('gekishu_kagekisoku', -1)">-</button>
            <div id="gekishu_kagekisoku" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('gekishu_kagekisoku', 1)">+</button>
        </div>
    </div>

    <!-- 戦型グループ -->
    <div class="group-box" style="border-left-color: #e91e63;">
        <div class="group-title" style="color: #e91e63;">戦型の絆</div>
        <div class="fruit-row">
            <div class="fruit-name">戦型加撃</div>
            <button class="btn-control btn-minus" onclick="changeCount('senkei_kageki', -1)">-</button>
            <div id="senkei_kageki" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('senkei_kageki', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">戦型加命撃</div>
            <button class="btn-control btn-minus" onclick="changeCount('senkei_kameigeki', -1)">-</button>
            <div id="senkei_kameigeki" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('senkei_kameigeki', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">戦型加撃速</div>
            <button class="btn-control btn-minus" onclick="changeCount('senkei_kagekisoku', -1)">-</button>
            <div id="senkei_kagekisoku" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('senkei_kagekisoku', 1)">+</button>
        </div>
    </div>

    <!-- その他グループ（速必殺、ケガ減りを追加） -->
    <div class="group-box" style="border-left-color: #9c27b0;">
        <div class="group-title" style="color: #9c27b0;">その他</div>
        <div class="fruit-row">
            <div class="fruit-name">熱き友撃</div>
            <button class="btn-control btn-minus" onclick="changeCount('yugeki', -1)">-</button>
            <div id="yugeki" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('yugeki', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">速必殺</div>
            <button class="btn-control btn-minus" onclick="changeCount('sokuhissatsu', -1)">-</button>
            <div id="sokuhissatsu" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('sokuhissatsu', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">ケガ減り</div>
            <button class="btn-control btn-minus" onclick="changeCount('kegaheri', -1)">-</button>
            <div id="kegaheri" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('kegaheri', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">将命削り</div>
            <button class="btn-control btn-minus" onclick="changeCount('shoumei', -1)">-</button>
            <div id="shoumei" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('shoumei', 1)">+</button>
        </div>
        <div class="fruit-row">
            <div class="fruit-name">兵命削り</div>
            <button class="btn-control btn-minus" onclick="changeCount('heimei', -1)">-</button>
            <div id="heimei" class="count-display">0</div>
            <button class="btn-control btn-plus" onclick="changeCount('heimei', 1)">+</button>
        </div>
    </div>

    <!-- 全リセットボタン -->
    <button class="btn-reset" onclick="handleReset()">すべてのカウントをリセット</button>
</div>

<script>
    // 完全に独立した新しい安全なデータ保存キー
    const STORAGE_KEY = 'monst_fruit_14_items_pure_v1';

    let data = {
        douzoku_kageki: 0, douzoku_kameigeki: 0, douzoku_kagekisoku: 0,
        gekishu_kageki: 0, gekishu_kameigeki: 0, gekishu_kagekisoku: 0,
        senkei_kageki: 0,  senkei_kameigeki: 0,  senkei_kagekisoku: 0,
        yugeki: 0, sokuhissatsu: 0, kegaheri: 0, shoumei: 0, heimei: 0
    };

    const savedData = localStorage.getItem(STORAGE_KEY);
    if (savedData) {
        try { data = JSON.parse(savedData); } catch(e) { console.error(e); }
    }

    function updateDisplay() {
        for (let key in data) {
            let element = document.getElementById(key);
            if (element) { element.innerText = data[key]; }
        }
    }

    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function changeCount(key, value) {
        data[key] += value;
        if (data[key] < 0) data[key] = 0;
        saveData();
        updateDisplay();
    }

    function handleReset() {
        if (confirm("すべての実のカウントを0に戻しますか？")) {
            for (let key in data) { data[key] = 0; }
            saveData();
            updateDisplay();
        }
    }

    updateDisplay();
</script>

</body>
</html>
