<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モンスト キャラ別厳選マネージャー</title>
    <link rel="apple-touch-icon" href="icon.png">
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 10px;
        }
        .container {
            max-width: 500px;
            margin: 10px auto;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        h1 { font-size: 18px; color: #ffca28; text-align: center; margin-top: 5px; margin-bottom: 15px; border-bottom: 2px solid #ffca28; padding-bottom: 5px; }
        .add-box {
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #444;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .select-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #333;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #555;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 5px;
        }
        .select-container label { cursor: pointer; }
        .btn-add {
            width: 100%;
            background-color: #00e676;
            color: #000;
            font-weight: bold;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .search-box { margin-bottom: 15px; }
        .char-card {
            background: #252525;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #ffca28;
            position: relative;
        }
        
        .char-card.acc-main { border-left-color: #2196f3; }
        .char-card.acc-sub1 { border-left-color: #ff9800; }
        .char-card.acc-sub2 { border-left-color: #4caf50; }
        .char-card.acc-sub3 { border-left-color: #9c27b0; }

        .char-header {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding-right: 90px; /* ボタンと文字が被らないための余白 */
        }
        .char-name {
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }
        .account-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 10px;
            color: white;
        }
        .bg-main { background-color: #2196f3; }
        .bg-sub1 { background-color: #ff9800; }
        .bg-sub2 { background-color: #4caf50; }
        .bg-sub3 { background-color: #9c27b0; }

        .slots-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 5px;
        }
        .fruit-slot {
            background: #333;
            padding: 6px;
            border-radius: 4px;
            font-size: 11px;
            text-align: center;
            border: 1px solid #444;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        /* 編集・削除ボタンを綺麗に並べるためのスタイル */
        .action-buttons {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }
        .btn-mini {
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 11px;
            color: white;
        }
        .btn-edit { background: #0288d1; }   /* 編集ボタンは青色 */
        .btn-delete { background: #cf6679; } /* 削除ボタンは赤色 */
    </style>
</head>
<body>

<div class="container">
    <h1>キャラ別厳選マネージャー</h1>
    <div class="add-box">
        <input type="text" id="charName" placeholder="キャラクター名を入力 (例: ヤクモ)">
        <div class="select-container">
            <span>アカウント：</span>
            <label><input type="radio" name="accountType" value="本垢" checked> 本垢</label>
            <label><input type="radio" name="accountType" value="サブ1"> サブ1</label>
            <label><input type="radio" name="accountType" value="サブ2"> サブ2</label>
            <label><input type="radio" name="accountType" value="サブ3"> サブ3</label>
        </div>
        <div class="select-container">
            <span>実の枠数：</span>
            <label><input type="radio" name="slotCount" value="2" onchange="toggleSlotVisibility(2)"> 2枠</label>
            <label><input type="radio" name="slotCount" value="3" checked onchange="toggleSlotVisibility(3)"> 3枠</label>
            <label><input type="radio" name="slotCount" value="4" onchange="toggleSlotVisibility(4)"> 4枠</label>
        </div>
        
        <div class="slots-container" style="margin-bottom: 8px;">
            <select id="slot1">
                <option value="未厳選">未厳選</option><option value="同族加撃">同族加撃</option><option value="同族加命撃">同族加命撃</option><option value="同族加撃速">同族加撃速</option><option value="撃種加撃">撃種加撃</option><option value="撃種加命撃">撃種加命撃</option><option value="撃種加撃速">撃種加撃速</option><option value="戦型加撃">戦型加撃</option><option value="戦型加命撃">戦型加命撃</option><option value="戦型加撃速">戦型加撃速</option><option value="熱き友撃">熱き友撃</option><option value="速必殺">速必殺</option><option value="ケガ減り">ケガ減り</option><option value="将命削り">将命削り</option><option value="兵命削り">兵命削り</option>
            </select>
            <select id="slot2">
                <option value="未厳選">未厳選</option><option value="同族加撃">同族加撃</option><option value="同族加命撃">同族加命撃</option><option value="同族加撃速">同族加撃速</option><option value="撃種加撃">撃種加撃</option><option value="撃種加命撃">撃種加命撃</option><option value="撃種加撃速">撃種加撃速</option><option value="戦型加撃">戦型加撃</option><option value="戦型加命撃">戦型加命撃</option><option value="戦型加撃速">戦型加撃速</option><option value="熱き友撃">熱き友撃</option><option value="速必殺">速必殺</option><option value="ケガ減り">ケガ減り</option><option value="将命削り">将命削り</option><option value="兵命削り">兵命削り</option>
            </select>
            <select id="slot3">
                <option value="未厳選">未厳選</option><option value="同族加撃">同族加撃</option><option value="同族加命撃">同族加命撃</option><option value="同族加撃速">同族加撃速</option><option value="撃種加撃">撃種加撃</option><option value="撃種加命撃">撃種加命撃</option><option value="撃種加撃速">撃種加撃速</option><option value="戦型加撃">戦型加撃</option><option value="戦型加命撃">戦型加命撃</option><option value="戦型加撃速">戦型加撃速</option><option value="熱き友撃">熱き友撃</option><option value="速必殺">速必殺</option><option value="ケガ減り">ケガ減り</option><option value="将命削り">将命削り</option><option value="兵命削り">兵命削り</option>
            </select>
            <select id="slot4" style="display: none;">
                <option value="未厳選">未厳選</option><option value="同族加撃">同族加撃</option><option value="同族加命撃">同族加命撃</option><option value="同族加撃速">同族加撃速</option><option value="撃種加撃">撃種加撃</option><option value="撃種加命撃">撃種加命撃</option><option value="撃種加撃速">撃種加撃速</option><option value="戦型加撃">戦型加撃</option><option value="戦型加命撃">戦型加命撃</option><option value="戦型加撃速">戦型加撃速</option><option value="熱き友撃">熱き友撃</option><option value="速必殺">速必殺</option><option value="ケガ減り">ケガ減り</option><option value="将命削り">将命削り</option><option value="兵命削り">兵命削り</option>
            </select>
        </div>
        <button class="btn-add" id="submitBtn" onclick="addCharacter()">キャラをリストに追加</button>
    </div>
    <div class="search-box">
        <input type="text" id="searchBar" placeholder="🔍 キャラ名で絞り込み..." oninput="renderList()">
    </div>
    <div id="characterList"></div>
</div>

<script>
    // 編集データに対応するため保存キーを最終決定版に変更
    const STORAGE_KEY = 'monst_char_manager_4accounts_edit_v1';

    let editId = null; // 編集中のキャラIDを一時保存する変数

    function toggleSlotVisibility(count) {
        document.getElementById('slot3').style.display = count >= 3 ? 'block' : 'none';
        document.getElementById('slot4').style.display = count >= 4 ? 'block' : 'none';
    }

    let charList = [];
    const savedData = localStorage.getItem(STORAGE_KEY);
    if (savedData) {
        try { charList = JSON.parse(savedData); } catch(e) { console.error(e); }
    }

    function addCharacter() {
        const nameInput = document.getElementById('charName');
        const name = nameInput.value.trim();
        if (!name) { alert('キャラ名を入力してください！'); return; }
        const selectedCount = parseInt(document.querySelector('input[name="slotCount"]:checked').value);
        const account = document.querySelector('input[name="accountType"]:checked').value;
        
        const fruit1 = document.getElementById('slot1').value;
        const fruit2 = document.getElementById('slot2').value;
        const fruit3 = selectedCount >= 3 ? document.getElementById('slot3').value : '---';
        const fruit4 = selectedCount >= 4 ? document.getElementById('slot4').value : '---';

        if (editId !== null) {
            // 【編集モード】既存キャラのデータを書き換え
            const idx = charList.findIndex(c => c.id === editId);
            if (idx !== -1) {
                charList[idx].name = name;
                charList[idx].account = account;
                charList[idx].slotCount = selectedCount;
                charList[idx].s1 = fruit1;
                charList[idx].s2 = fruit2;
                charList[idx].s3 = fruit3;
                charList[idx].s4 = fruit4;
            }
            editId = null;
